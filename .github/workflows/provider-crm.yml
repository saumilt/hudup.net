name: Provider CRM checks

on:
  pull_request:
    paths:
      - "backend/client_services.py"
      - "backend/routes_client_services.py"
      - "backend/server.py"
      - "backend/tests/test_client_services.py"
      - "frontend/**"
      - ".github/workflows/provider-crm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install fastapi==0.110.1 "pydantic>=2.6.4,<3" httpx==0.28.1 pymongo==4.6.3 pytest
      - run: python -m compileall -q backend/client_services.py backend/routes_client_services.py backend/server.py
      - run: python -m pytest -c /dev/null backend/tests/test_client_services.py -q
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "https://example.invalid"
